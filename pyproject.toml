[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uripack-refactor"
version = "0.1.0a1"
description = "Contract-first, guard-mediated extraction of URI process packages from Subactor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "uripack contributors"}]
dependencies = ["jsonschema>=4.18,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "coverage>=7,<8"]

[project.scripts]
uripack = "uripack_refactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uripack_refactor = ["resources/*.json", "resources/*.md", "resources/*.gbnf", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
